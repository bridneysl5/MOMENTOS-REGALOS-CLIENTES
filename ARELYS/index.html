<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Arelys! • Paw Patrol</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos hermosos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts alegres y elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paw-red: #ED1C24;
            --paw-blue: #00AEEF;
            --paw-yellow: #FCEE21;
            --paw-dark-blue: #0A3B8C;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #051e4a;
            overflow-x: hidden;
        }

        .font-cursive {
            font-family: 'Pacifico', cursive;
        }

        /* Efectos de flotación suave para las fotos */
        @keyframes float-polaroid {
            0%, 100% { transform: translateY(0px) rotate(1deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
        }
        
        @keyframes float-bg-left {
            0%, 100% { transform: translateY(0px) rotate(-8deg); }
            50% { transform: translateY(-8px) rotate(-11deg); }
        }

        @keyframes float-bg-right {
            0%, 100% { transform: translateY(0px) rotate(8deg); }
            50% { transform: translateY(-8px) rotate(11deg); }
        }

        .animate-float-main {
            animation: float-polaroid 5s ease-in-out infinite;
        }

        .animate-float-bg-left {
            animation: float-bg-left 6s ease-in-out infinite;
        }

        .animate-float-bg-right {
            animation: float-bg-right 5.5s ease-in-out infinite;
        }

        /* Estilo personalizado de barra de progreso */
        .progress-bar-fill {
            transition: width 0.1s linear;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center p-0 md:p-4 text-white">

    <!-- CONTENEDOR EFECTO CONFETI -->
    <div id="confetti-container" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- PANTALLA DE INICIO (Regalo para desbloquear Audio automáticamente) -->
    <div id="welcome-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0A3B8C] transition-all duration-1000 ease-in-out">
        <!-- Decoraciones en esquinas del welcome -->
        <div class="absolute top-0 right-0 w-32 h-32 opacity-80 pointer-events-none">
            <svg viewBox="0 0 100 100" class="w-full h-full text-[#FCEE21] fill-current">
                <path d="M100,0 Q80,10 60,0 T20,0 T0,0 L100,100 Z" />
            </svg>
        </div>
        <div class="absolute bottom-0 left-0 w-32 h-32 opacity-80 pointer-events-none">
            <svg viewBox="0 0 100 100" class="w-full h-full text-[#FCEE21] fill-current rotate-180">
                <path d="M100,0 Q80,10 60,0 T20,0 T0,0 L100,100 Z" />
            </svg>
        </div>

        <div class="text-center p-6 max-w-sm mx-auto relative z-10">
            <div class="w-24 h-24 bg-[#ED1C24] rounded-full flex items-center justify-center mx-auto shadow-lg border-4 border-[#FCEE21] animate-bounce mb-6">
                <i class="fa-solid fa-paw text-[#FCEE21] text-5xl"></i>
            </div>
            
            <h1 class="text-3xl font-bold tracking-wide text-white mb-2">¡Sorpresa para Arelys!</h1>
            <p class="text-[#00AEEF] text-sm font-semibold mb-6">Toca el botón para abrir tu regalo especial de cumpleaños</p>
            
            <button onclick="startCelebration()" class="w-full py-4 bg-[#ED1C24] hover:bg-red-600 text-[#FCEE21] rounded-full font-bold text-lg shadow-xl border-b-4 border-red-800 active:border-b-0 active:translate-y-1 transition-all duration-150 flex items-center justify-center gap-3">
                <i class="fa-solid fa-gift animate-pulse"></i>
                <span>Abrir Regalo</span>
            </button>
        </div>
    </div>

    <!-- AUDIO DE FONDO (Fácilmente reemplazable) -->
    <audio id="bg-music" loop>
        <!-- Reemplaza el src de abajo con tu archivo MP3 (ej. "musica.mp3") -->
        <source id="music-source" src="musica/Cancion Patrulla Canina  Paw patrol oficial AutoMagicKids (1).mp3" type="audio/mp3">
    </audio>

    <!-- TARJETA FORMATO REEL (9:16) -->
    <main id="main-content" class="relative z-10 w-full max-w-[430px] aspect-[9/16] bg-[#0A3B8C] rounded-[32px] shadow-2xl overflow-hidden flex flex-col justify-between py-8 px-6 border-4 border-[#00AEEF] opacity-0 transition-opacity duration-1000">
        
        <!-- DECORACIONES DE ESQUINA (Estilo líneas amarillas onduladas) -->
        <!-- Superior Derecha -->
        <div class="absolute top-0 right-0 w-28 h-28 pointer-events-none z-10">
            <svg viewBox="0 0 100 100" class="w-full h-full text-[#FCEE21] fill-none stroke-current stroke-[4] stroke-linecap-round">
                <path d="M60,0 C65,20 80,35 100,40" />
                <path d="M40,0 C48,28 72,52 100,60" />
                <path d="M80,0 C83,10 90,17 100,20" />
            </svg>
        </div>
        <!-- Inferior Izquierda -->
        <div class="absolute bottom-0 left-0 w-28 h-28 pointer-events-none z-10">
            <svg viewBox="0 0 100 100" class="w-full h-full text-[#FCEE21] fill-none stroke-current stroke-[4] stroke-linecap-round rotate-180">
                <path d="M60,0 C65,20 80,35 100,40" />
                <path d="M40,0 C48,28 72,52 100,60" />
                <path d="M80,0 C83,10 90,17 100,20" />
            </svg>
        </div>

        <!-- SECCIÓN SUPERIOR: Título del Cumpleaños -->
        <div class="text-center space-y-1 pt-2 z-10">
            <h2 class="text-2xl font-bold tracking-wide uppercase select-none flex justify-center items-center gap-2">
                <span class="text-[#ED1C24]">Feliz</span>
                <span class="text-[#00AEEF]">cumpleaños</span>
            </h2>
            <h1 class="font-cursive text-5xl text-[#FCEE21] drop-shadow-[0_4px_6px_rgba(0,0,0,0.6)] select-none">
                Arelys
            </h1>
        </div>

        <!-- SECCIÓN CENTRAL: Carrusel de Fotos Polaroid Flotantes -->
        <div class="relative w-full flex items-center justify-center my-auto min-h-[310px] z-10">
            
            <!-- Polaroid de fondo izquierda -->
            <div class="absolute left-2 w-32 aspect-[4/5] bg-white p-2 pb-5 shadow-lg rounded-sm border-4 border-[#FCEE21] -rotate-12 opacity-60 animate-float-bg-left">
                <div class="w-full h-[82%] bg-slate-300 overflow-hidden rounded-sm">
                    <img src="imagenes/10.png" alt="Decoración Paw Patrol" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x400/0A3B8C/ffffff?text=🐾'">
                </div>
            </div>

            <!-- Polaroid de fondo derecha -->
            <div class="absolute right-2 w-32 aspect-[4/5] bg-white p-2 pb-5 shadow-lg rounded-sm border-4 border-[#FCEE21] rotate-12 opacity-60 animate-float-bg-right">
                <div class="w-full h-[82%] bg-slate-300 overflow-hidden rounded-sm">
                    <img src="imagenes/11.png" alt="Paw Patrol Teddy" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x400/ED1C24/ffffff?text=🦴'">
                </div>
            </div>

            <!-- Polaroid Central Principal Animada -->
            <div class="relative w-56 aspect-[4/5] bg-white p-3 pb-8 shadow-2xl rounded-sm border-4 border-white transition-all duration-500 animate-float-main z-20">
                <!-- Imagen -->
                <div class="w-full h-[84%] overflow-hidden bg-slate-100 rounded-sm relative">
                    <!-- Primera imagen por defecto: Tu oso de peluche con gorro Paw Patrol -->
                    <img id="slideshow-img" src="imagenes/1.png" alt="Foto Recuerdo de Arelys" class="w-full h-full object-cover transition-opacity duration-500 ease-in-out" onerror="this.src='https://placehold.co/400x500/0A3B8C/ffffff?text=Feliz+Cumpleaños'">
                </div>
                <!-- Pie de Foto -->
                <div class="absolute bottom-2 left-2 right-2 text-center">
                    <p id="slideshow-caption" class="font-cursive text-lg text-[#0A3B8C] font-bold truncate">¡Momentos Especiales! 🎁</p>
                </div>
            </div>
            
            <!-- Estrellas decorativas esparcidas -->
            <i class="fa-solid fa-star absolute top-2 left-6 text-[#FCEE21] text-lg animate-pulse"></i>
            <i class="fa-solid fa-star absolute bottom-4 right-8 text-[#00AEEF] text-sm animate-bounce"></i>
            <i class="fa-solid fa-bone absolute bottom-12 left-8 text-[#ED1C24] text-md rotate-45 opacity-80"></i>
        </div>

        <!-- SECCIÓN INFERIOR: Reproductor Musical y Acceso al Video -->
        <div class="space-y-4 w-full z-10 px-2">
            
            <!-- Disco musical giratorio -->
            <div class="flex justify-center mb-2">
                <button onclick="toggleMusic()" id="spinning-record" class="relative w-16 h-16 bg-black rounded-full border-2 border-[#FCEE21] flex items-center justify-center shadow-lg animate-[spin_3s_linear_infinite]" style="animation-play-state: running;">
                    <!-- Centro del disco -->
                    <div class="w-5 h-5 bg-[#00AEEF] rounded-full border-2 border-black flex items-center justify-center z-10">
                        <i class="fa-solid fa-music text-[8px] text-white"></i>
                    </div>
                    <!-- Surcos del disco -->
                    <div class="absolute inset-1 rounded-full border border-white/20 pointer-events-none"></div>
                    <div class="absolute inset-2.5 rounded-full border border-white/10 pointer-events-none"></div>
                </button>
            </div>

            <!-- Botón del Video Final -->
            <button onclick="openVideoModal()" class="w-full py-4 bg-[#ED1C24] hover:bg-red-600 text-white rounded-2xl font-bold flex flex-col items-center justify-center gap-1 shadow-lg shadow-red-900/40 border-b-4 border-red-800 active:border-b-0 active:translate-y-1 transition-all duration-150">
                <div class="flex items-center gap-2 text-lg text-[#FCEE21]">
                    <i class="fa-solid fa-video animate-pulse"></i>
                    <span>Video Sorpresa</span>
                </div>
            </button>

            <!-- Footer de Pedidos -->
            <div class="text-center pt-1 pb-2 space-y-0.5">
                <p class="text-[10px] text-white/70 tracking-widest font-bold uppercase">Momentos Especiales</p>
                <p class="text-[10px] text-white/60 tracking-widest font-bold">PEDIDOS AL 916098803</p>
            </div>
        </div>
    </main>

    <!-- MODAL DE VIDEO VERTICAL (TAMAÑO REEL 9:16) -->
    <div id="video-modal" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <!-- Contenedor del video estructurado en proporción vertical -->
        <div class="relative w-full max-w-[390px] aspect-[9/16] bg-black rounded-3xl border-2 border-[#00AEEF] overflow-hidden flex flex-col justify-between">
            
            <!-- Barra superior del video -->
            <div class="absolute top-0 inset-x-0 bg-gradient-to-b from-black/80 to-transparent p-4 flex justify-between items-center z-10">
                <span class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle text-[#ED1C24] text-[8px] animate-ping"></i>
                    <span>Video Sorpresa Arelys</span>
                </span>
                <button onclick="closeVideoModal()" class="w-8 h-8 rounded-full bg-white/20 hover:bg-white/40 text-white flex items-center justify-center transition backdrop-blur-sm">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Etiqueta de Video -->
            <video id="reel-video" class="w-full h-full object-cover" controls playsinline>
                <!-- Reemplaza el src de abajo con tu video (ej. "video.mp4") -->
                <source id="video-source" src="video/videoplayback (2).mp4" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>

            <!-- Sin marca de agua -->
        </div>

        <!-- Mensaje Especial debajo del video -->
        <div class="w-full max-w-[390px] mt-6 text-center space-y-3 z-10">
            <p class="text-white text-[15px] font-medium leading-tight drop-shadow-md">Momentos especiales te da este regalo, espero que lo disfrutes 🎁</p>
            <a href="https://momentos-regalos.netlify.app" target="_blank" class="inline-flex items-center gap-2 px-6 py-2.5 bg-[#FCEE21] hover:bg-yellow-400 text-[#0A3B8C] font-bold text-sm rounded-full shadow-[0_0_15px_rgba(252,238,33,0.3)] hover:scale-105 active:scale-95 transition-all">
                <i class="fa-solid fa-link"></i>
                Visítanos aquí
            </a>
        </div>
    </div>

    <!-- SCRIPT DE COMPORTAMIENTO -->
    <script>
        // Arreglo de fotos para el carrusel infinito de la Polaroid principal
        // Puedes agregar más rutas de fotos aquí fácilmente
        const playlistPhotos = [
            { url: "imagenes/1.png", caption: "¡Feliz Cumpleaños! 🎂" },
            { url: "imagenes/2.png", caption: "¡Qué gran día! 🎉" },
            { url: "imagenes/3.png", caption: "¡Sonrisas! 🐾" },
            { url: "imagenes/4.png", caption: "¡Regalos geniales! 🎁" },
            { url: "imagenes/5.png", caption: "¡Deseos de Paw Patrol! 🦴" },
            { url: "imagenes/6.png", caption: "¡Mucha diversión! 🎈" },
            { url: "imagenes/7.png", caption: "¡Momentos Mágicos! ✨" },
            { url: "imagenes/8.png", caption: "¡Amigos increíbles! 💕" },
            { url: "imagenes/9.png", caption: "¡Día inolvidable! 🌟" }
        ];

        let currentPhotoIndex = 0;
        let slideshowInterval = null;
        
        const music = document.getElementById('bg-music');
        const spinningRecord = document.getElementById('spinning-record');
        const video = document.getElementById('reel-video');

        // Inicializar efectos al cargar
        window.onload = function() {
            createConfetti();
        };

        // Activa la pantalla principal y reproduce la música
        function startCelebration() {
            // Ocultar bienvenida
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
                
                // Mostrar tarjeta Reel
                const main = document.getElementById('main-content');
                main.classList.remove('opacity-0');
                main.classList.add('opacity-100');
            }, 1000);

            // Intentar reproducir música automáticamente
            playMusic();
            
            // Iniciar carrusel de fotos
            startSlideshow();
        }

        // --- SISTEMA DEL REPRODUCTOR DE MÚSICA ---
        function playMusic() {
            music.play().then(() => {
                if (spinningRecord) spinningRecord.style.animationPlayState = 'running';
            }).catch(e => {
                console.log("Error al reproducir audio: requiere interacción.");
            });
        }

        function toggleMusic() {
            if (music.paused) {
                playMusic();
            } else {
                music.pause();
                if (spinningRecord) spinningRecord.style.animationPlayState = 'paused';
            }
        }

        // --- BUCLE DE IMÁGENES AUTOMÁTICO (CARRUSEL) ---
        function startSlideshow() {
            if (slideshowInterval) clearInterval(slideshowInterval);
            slideshowInterval = setInterval(() => {
                nextPhoto();
            }, 3500); // Cambia cada 3.5 segundos
        }

        function showPhoto(index) {
            if (playlistPhotos.length === 0) return;
            
            const imgElement = document.getElementById('slideshow-img');
            const captionElement = document.getElementById('slideshow-caption');
            
            // Transición de desvanecimiento suave
            imgElement.style.opacity = '0';
            captionElement.style.opacity = '0';
            
            setTimeout(() => {
                currentPhotoIndex = (index + playlistPhotos.length) % playlistPhotos.length;
                const currentItem = playlistPhotos[currentPhotoIndex];
                
                imgElement.src = currentItem.url;
                captionElement.innerText = currentItem.caption;
                
                imgElement.style.opacity = '1';
                captionElement.style.opacity = '1';
            }, 300);
        }

        function nextPhoto() {
            showPhoto(currentPhotoIndex + 1);
        }

        // --- CONTROL DEL MODAL DE VIDEO (REEL) ---
        function openVideoModal() {
            const modal = document.getElementById('video-modal');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('opacity-100');
            
            // Pausar música de fondo para escuchar el video
            if (!music.paused) {
                music.pause();
                if (spinningRecord) spinningRecord.style.animationPlayState = 'paused';
            }
            
            // Iniciar video
            video.currentTime = 0;
            video.play();
        }

        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            modal.classList.add('pointer-events-none');
            modal.classList.remove('opacity-100');
            
            // Pausar el video
            video.pause();

            // Reanudar música de fondo
            playMusic();
        }

        // --- GENERADOR DE CONFETI DE PAW PATROL ---
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#ED1C24', '#00AEEF', '#FCEE21', '#FFFFFF', '#0A3B8C'];
            const shapes = ['square', 'circle', 'triangle'];
            const count = 50;

            for (let i = 0; i < count; i++) {
                const element = document.createElement('div');
                element.className = 'absolute pointer-events-none';
                
                // Color y forma aleatorios
                const color = colors[Math.floor(Math.random() * colors.length)];
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                
                element.style.backgroundColor = color;
                element.style.width = `${Math.random() * 8 + 6}px`;
                element.style.height = `${Math.random() * 8 + 6}px`;
                
                if (shape === 'circle') {
                    element.style.borderRadius = '50%';
                } else if (shape === 'triangle') {
                    element.style.clipPath = 'polygon(50% 0%, 0% 100%, 100% 100%)';
                }

                // Posiciones y animaciones aleatorias
                const left = Math.random() * 100;
                const duration = 5 + Math.random() * 7;
                const delay = Math.random() * -12;

                element.style.left = `${left}vw`;
                element.style.top = `-20px`;
                element.style.opacity = Math.random() * 0.7 + 0.3;
                
                // Animación de caída
                element.animate([
                    { transform: 'translateY(0px) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(110vh) rotate(${Math.random() * 360 + 360}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    iterations: Infinity,
                    easing: 'linear'
                });

                container.appendChild(element);
            }
        }
    </script>
</body>
</html>
